name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ShoppingCart/ShoppingCart.sln

      - name: Build
        run: dotnet build ShoppingCart/ShoppingCart.sln -c Release --no-restore

      - name: Run the demo
        run: dotnet run --project ShoppingCart/Program/Program.csproj -c Release --no-build
